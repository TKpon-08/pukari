e:10px}}</style></head><body><main><header class="top"><img class="title-otter" src="assets/otter-box.png" alt="箱入りのコツメカワウソ" width="52" height="52"><div class="header-brand"><small class="header-en">MY WELLNESS JOURNAL</small><h1><span class="brand-wordmark"><span class="brand-main">PUKARI</span><span class="brand-kana">ぷかり</span></span></h1></div></header><div id="app"></div></main><nav id="nav"></nav><div id="toast"></div>
<script>
"use strict";
const KEY="kokorolog-v01",SETTINGS="kokorolog-settings-v01",metrics=["気分","意欲","集中力","疲労感"],symptomNames=["発熱","頭痛","頭重感","肩こり","眠気","吐き気","不安感","その他"],faces=["😣","😟","😐","🙂","😄"],fatigueFaces=["😊","🙂","😐","😣","😫"];
const iconNames={"edit_square":"pencil-simple","calendar_month":"calendar-blank","bar_chart":"chart-bar","settings":"gear-six","refresh":"arrow-clockwise","chevron_left":"caret-left","chevron_right":"caret-right","cloud":"cloud","sunny":"sun","partly_cloudy_day":"cloud-sun","rainy":"cloud-rain","weather_snowy":"cloud-snow","thunderstorm":"cloud-lightning","foggy":"cloud-fog","eco":"leaf","trend_up":"trend-up","trend_down":"trend-down","trend_flat":"arrow-right","trash":"trash","sentiment_very_dissatisfied":"smiley-sad","sentiment_dissatisfied":"smiley-meh","sentiment_neutral":"smiley","sentiment_satisfied":"smiley","sentiment_very_satisfied":"smiley-wink"};const icon=(name)=>'<i class="ph ph-'+(iconNames[name]||'circle')+'" aria-hidden="true"></i>';const faceIcons=["sentiment_very_dissatisfied","sentiment_dissatisfied","sentiment_neutral","sentiment_satisfied","sentiment_very_satisfied"];const moodIconNames=["mood-sad-dizzy","mood-sad-squint","mood-empty","mood-smile","mood-happy"],fatigueIconNames=[...moodIconNames].reverse();const tablerFacePaths={"mood-sad-dizzy":["M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0","M14.5 16.05a3.5 3.5 0 0 0 -5 0","M8 9l2 2","M10 9l-2 2","M14 9l2 2","M16 9l-2 2"],"mood-sad-squint":["M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0","M14.5 16.05a3.5 3.5 0 0 0 -5 0","M8.5 11.5l1.5 -1.5l-1.5 -1.5","M15.5 11.5l-1.5 -1.5l1.5 -1.5"],"mood-empty":["M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0","M9 10l.01 0","M15 10l.01 0","M9 15l6 0"],"mood-smile":["M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0","M9 10l.01 0","M15 10l.01 0","M9.5 15a3.5 3.5 0 0 0 5 0"],"mood-happy":["M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0","M9 9l.01 0","M15 9l.01 0","M8 13a4 4 0 1 0 8 0h-8"]};const scoreFaceIcon=(name)=>'<svg class="rating-face-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(tablerFacePaths[name]||tablerFacePaths["mood-empty"]).map(d=>'<path d="'+d+'"/>').join("")+'</svg>';const wxNames=(code)=>{if(code==null)return "cloud";if(code===0)return "sunny";if(code<=3)return "partly_cloudy_day";if(code>=51&&code<=67)return "rainy";if(code>=71&&code<=86)return "weather_snowy";if(code>=95)return "thunderstorm";return "foggy"};const place={name:"福知山市",lat:35.2967,lon:135.1266};let config={...place},entries=[],page="record",month=new Date(),selectedDate="",draft=blank(),editing=null,weather=null,weatherError="";
function blank(){return {scores:[null,null,null,null],symptoms:[],temp:"",other:"",memo:""}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"[]");entries=Array.isArray(x)?x.filter(e=>e&&e.id&&e.time&&Array.isArray(e.scores)):[]}catch{entries=[]}try{let s=JSON.parse(localStorage.getItem(SETTINGS)||"null");if(s&&typeof s.lat==="number"&&typeof s.lon==="number"&&typeof s.name==="string")config=s}catch{}}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function wxicon(code){return icon(wxNames(code))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display="none",2800)}
async function getWeather(){weatherError="";try{let url="https://api.open-meteo.com/v1/forecast?latitude="+config.lat+"&longitude="+config.lon+"&current=temperature_2m,relative_humidity_2m,surface_pressure,pressure_msl,weather_code,precipitation,rain,showers&hourly=pressure_msl&past_days=1&forecast_days=2&timezone=Asia%2FTokyo";let res=await fetch(url);if(!res.ok)throw Error("weather");let j=await res.json(),c=j.current,h=j.hourly,idx=h.time.findIndex(t=>t===c.time.slice(0,13)+":00");let prev=idx>=3?h.pressure_msl[idx-3]:null;weather={at:c.time,code:((c.rain||0)+(c.showers||0)>0 || (c.precipitation||0)>0) && ![51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(c.weather_code)?61:c.weather_code,temp:c.temperature_2m,humidity:c.relative_humidity_2m,pressure:c.pressure_msl,surface:c.surface_pressure,change:prev==null?null:Math.round((c.pressure_msl-prev)*10)/10,forecast:h.time.map((time,i)=>({time,pressure:h.pressure_msl[i]})).filter(v=>Number.isFinite(v.pressure)&&v.time>=c.time.slice(0,13)+':00').slice(0,25),location:config.name};}catch{weather=null;weatherError="天気を取得できませんでした"}render()}
function avgScore(e,index){return typeof e.scores[index]==="number"?e.scores[index]:null}
function dayEntries(day){return entries.filter(e=>localDate(e.time)===day).sort((a,b)=>b.time.localeCompare(a.time))}

function moodClass(v){return v===null?"":"score"+Math.max(0,Math.min(4,Math.round(v)))}
function dayWeather(day){let e=dayEntries(day).find(x=>x.weather&&x.weather.code!=null);return e?wxicon(e.weather.code):""}
function nav(){document.getElementById("nav").innerHTML=[["record","edit_square","記録"],["calendar","calendar_month","カレンダー"],["summary","bar_chart","月間集計"],["settings","settings","設定"]].map(x=>'<button class="'+(page===x[0]?"active":"")+'" data-nav="'+x[0]+'"><span class="ico">'+icon(x[1])+"</span><span class=\"nav-label\">"+x[2]+"</span></button>").join("")}
function render(){nav();document.getElementById("app").innerHTML=page==="record"?recordView():page==="calendar"?calendarView():page==="summary"?summaryView():settingsView()}
const waveIcon=()=>'<i class="ph ph-waves wave-mark" aria-hidden="true"></i>';function pressureTrend(change){if(change>=1)return '<span class="pressure-trend rising" role="img" aria-label="3時間前より気圧上昇" title="3時間前より気圧上昇">'+icon("trend_up")+'</span>';if(change<=-1)return '<span class="pressure-trend falling" role="img" aria-label="3時間前より気圧下降" title="3時間前より気圧下降">'+icon("trend_down")+'</span>';return '<span class="pressure-trend steady" role="img" aria-label="3時間前とほぼ横ばい" title="3時間前とほぼ横ばい">'+icon("trend_flat")+'</span>'}
function pressureStatus(w){if(!w||!Number.isFinite(w.change))return {level:"unknown",icon:"cloud",title:"気圧の変化を確認できません",detail:"データが取得できたら表示するよ"};let d=w.change;if(d<=-4)return {level:"high",icon:"trend_down",title:"気圧が大きく下降中",detail:"体調の変化に気を配ってね"};if(d<=-2)return {level:"watch",icon:"trend_down",title:"気圧が下降中",detail:"いつもより少し気にかけてみよう"};if(d<=-1)return {level:"stable",icon:"trend_down",title:"気圧がゆるやかに下降中",detail:"3時間前より少し下がっているよ"};if(d>=2)return {level:"stable",icon:"trend_up",title:"気圧が上昇中",detail:"3時間前より気圧が上がっているよ"};if(d>=1)return {level:"stable",icon:"trend_up",title:"気圧がゆるやかに上昇中",detail:"3時間前より少し上がっているよ"};return {level:"stable",icon:"trend_flat",title:"気圧の変化は小さめ",detail:"3時間前と比べてほぼ横ばいだよ"}}
function pressureRisk(d){if(!Number.isFinite(d))return {label:"データなし",n:0};let a=Math.abs(d),n=a>=5?3:a>=3?2:a>=1.5?1:0;return {n,label:["おだやか","やや注意","注意","警戒"][n]}}
function pressureForecastView(w){
if(!w?.forecast?.length)return '<div class="pressure-forecast">予報データを取得できませんでした</div>';
const v=w.forecast,colors=["#7FCABB","#F2D079","#F1A267","#E88787"];
const risks=v.map((p,i)=>{let prev=i>=3?v[i-3].pressure:i===0?(Number.isFinite(w.change)?p.pressure-w.change:null):w.pressure;return pressureRisk(Number.isFinite(prev)?p.pressure-prev:null)});
const left=6,right=314,baseline=43,step=(right-left)/Math.max(1,v.length-1);

const fmt=n=>n.toFixed(1);
const segment=(a,b)=>{let mid=(a.x+b.x)/2;return 'M '+fmt(a.x)+' '+fmt(a.y)+' C '+fmt(mid)+' '+fmt(a.y)+' '+fmt(mid)+' '+fmt(b.y)+' '+fmt(b.x)+' '+fmt(b.y)};
const paths=points.slice(1).map((p,i)=>'<path d="'+segment(points[i],p)+'" fill="none" stroke="'+colors[risks[i+1].n]+'" stroke-width="3" stroke-linecap="round"/>').join("");
const labels=v.map((p,i)=>i%6===0?'<text x="'+fmt(points[i].x)+'" y="88" text-anchor="'+(i===0?'start':'middle')+'">'+p.time.slice(11,13)+'時</text>':'').join("");
const svg='<svg class="pressure-wave" viewBox="0 0 320 94" role="img" aria-label="現在の気圧を基準に、上昇は基準線より上、下降は下に描いた24時間の気圧変化"><line x1="6" y1="'+baseline+'" x2="314" y2="'+baseline+'" stroke="#CBDCDD" stroke-width="1" stroke-dasharray="3 4"/>'+paths+'<circle cx="'+fmt(points[0].x)+'" cy="'+fmt(points[0].y)+'" r="3" fill="#00B1C3"/>'+labels+'</svg>';
return '<div class="pressure-forecast"><b>今後24時間の気圧変化</b>'+svg+'<div class="pressure-legend">'+["おだやか","やや注意","注意","警戒"].map((label,i)=>'<span><i style="color:'+colors[i]+'">●</i> '+label+'</span>').join("")+'</div><small>点線は現在の気圧。上下の波は予報気圧の変化、色は3時間の変化量による参考注意度です。</small></div>'
}
function otterMood(){const a=draft.scores;const mood=a[0];if(mood!==null&&mood<=1)return "tired";if(draft.symptoms.includes("眠気")||a[3]!==null&&a[3]>=3)return "sleepy";if(mood!==null&&mood>=3)return "happy";if(a[2]!==null&&a[2]<=1)return "tired";return "normal"}function otterImage(name){return '<img class="otter-img'+(name==="normal"?" otter-img-normal":"")+'" src="assets/otter-'+name+'.png" alt="コツメカワウソ" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span class="otter-fallback" style="display:none">'+otterSprite(name==="sleepy"?"rest":name==="tired"?"rest":name==="happy"?"happy":"normal")+'</span>'}function otterMessage(name){return {happy:"いい感じ！",tired:"無理せず、ゆっくりね",sleepy:"ひと休みしよう",normal:"自分のペースでいこう"}[name]||"自分のペースでいこう"}
function recordView(){let w=weather,p=pressureStatus(w),risk=pressureRisk(w?.change);return '<section class="card weather"><div class="row"><b class="section-heading">'+esc(config.name)+'の天気</b><button class="smallbtn weather-refresh" data-action="refresh" aria-label="天気を更新" title="天気を更新">'+icon('refresh')+'</button></div><div class="row weather-metrics"><div class="weather-temp">'+(w?wxicon(w.code):icon("cloud"))+' <b>'+(w?esc(w.temp)+"℃":"--")+'</b><span class="weather-humidity">湿度 '+(w?esc(w.humidity)+"%":"--")+'</span></div><div class="weather-pressure">気圧 '+(w?esc(w.pressure)+" hPa":"--")+' '+(w&&Number.isFinite(w.change)?pressureTrend(w.change):"")+'</div></div><div class="pressure-alert '+p.level+'" role="status"><div class="pressure-alert-compact"><span class="pressure-alert-title">'+icon(p.icon)+' <b>'+p.title+'</b></span><span class="pressure-risk-current">注意度 <b>'+risk.label+'</b></span></div></div><small>'+(w?"取得 "+esc(w.at.replace("T"," ")):(weatherError||"気象データを読み込み中…"))+'</small>'+pressureForecastView(w)+'</section>'+
'<section class="card"><div class="row"><h2 class="section-heading">'+(editing?"記録を編集":"今の調子は？")+'</h2><small>5段階評価・未選択OK</small></div>'+metrics.map((m,i)=>'<div class="faces"><span class="name">'+m+'</span>'+faces.map((f,j)=>'<button class="face '+(draft.scores[i]===j?"selected score-"+(i===3?4-j:j):"")+'" aria-label="'+m+" "+(j+1)+'" data-score="'+i+':'+j+'">'+scoreFaceIcon(i===3?fatigueIconNames[j]:moodIconNames[j])+"</button>").join("")+'</div>').join("")+'<div class="hint"><span>'+(draft.scores[3]===null?"左：低い／少ない":"左：低い／少ない")+'</span><span>右：高い／多い</span></div><div class="otter-preview"><div class="otter-preview-art">'+otterImage(otterMood())+'</div><div class="otter-preview-text"><b>'+waveIcon()+otterMessage(otterMood())+'</b><small>入力した内容に合わせてカワウソが変わるよ</small></div></div></section>'+
'<section class="card"><h2 class="section-heading">体の症状 <small>複数選択OK</small></h2><div class="chips">'+symptomNames.map(s=>'<button class="chip '+(draft.symptoms.includes(s)?"active":"")+'" data-symptom="'+s+'">'+(draft.symptoms.includes(s)?"✓ ":"")+s+"</button>").join("")+'</div>'+(draft.symptoms.includes("発熱")?'<p><label>体温（任意） <input class="field" style="max-width:160px" id="temp" type="number" min="30" max="43" step=".1" inputmode="decimal" placeholder="37.3" value="'+esc(draft.temp)+'"> ℃</label></p>':"")+(draft.symptoms.includes("その他")?'<p><input id="other" class="field" placeholder="その他の症状" value="'+esc(draft.other)+'"></p>':"")+'</section>'+
'<section class="card"><h2 class="section-heading">メモ <small>（任意）</small></h2><textarea id="memo" class="field" rows="3" placeholder="今日の出来事など">'+esc(draft.memo)+'</textarea></section><button class="primary" data-action="save">'+(icon("edit_square")+" "+(editing?"変更を保存":"記録する"))+'</button>'+(editing?'<p><button class="pill" data-action="cancel">編集をやめる</button></p>':"")+'<p class="muted">記録時刻は自動保存。天気を取得できない場合も記録できるよ。</p>'}
function calendarView(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let s='<section class="card"><div class="row"><h2 class="section-heading">カレンダー</h2><div class="monthbuttons"><button data-action="prev">'+icon("chevron_left")+'</button><b>'+y+'年'+(m+1)+'月</b><button data-action="next">'+icon("chevron_right")+'</button></div></div><small>背景色：気分の平均 · 天気：記録時の天気</small><div class="calendar" style="margin-top:18px">'+["日","月","火","水","木","金","土"].map(x=>'<div class="weekday">'+x+"</div>").join("");for(let i=0;i<first;i++)s+="<div></div>";for(let i=1;i<=days;i++){let day=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0"),v=dayAverage(day,0);s+='<button class="day '+moodClass(v)+(selectedDate===day?" selected":"")+'" data-day="'+day+'"><span class="num">'+i+'</span><span class="symbol">'+dayWeather(day)+'</span><span class="mini">'+(v===null?"":scoreFaceIcon(moodIconNames[Math.round(v)]))+"</span></button>"}s+='</div><div class="legend"><span class="legend-item"><i class="legend-swatch" style="background:var(--mood-very-low)"></i>とてもつらい</span><span class="legend-item"><i class="legend-swatch" style="background:var(--mood-low)"></i>つらい</span><span class="legend-item"><i class="legend-swatch" style="background:var(--mood-mid)"></i>普通</span><span class="legend-item"><i class="legend-swatch" style="background:var(--mood-good)"></i>良い</span><span class="legend-item"><i class="legend-swatch" style="background:var(--mood-very-good)"></i>とても良い</span></div></section>';let day=selectedDate||today(),es=dayEntries(day);s+='<section class="card"><h2 class="section-heading">'+esc(day)+' の記録</h2>'+(es.length?es.map(e=>'<article class="entry"><div class="entry-header"><b class="entry-time">'+esc(new Date(e.time).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}))+'</b><div class="entry-actions"><button class="entry-action edit" data-edit="'+esc(e.id)+'" aria-label="この記録を編集">'+icon("edit_square")+'<span>編集</span></button><button class="entry-action delete" data-delete="'+esc(e.id)+'" aria-label="この記録を削除">'+icon("trash")+'<span>削除</span></button></div></div><div class="entry-scores">'+e.scores.map((v,i)=>v===null?"":'<div class="entry-score score-'+(i===3?4-v:v)+'"><span class="entry-score-label">'+metrics[i]+'</span>'+scoreFaceIcon(i===3?fatigueIconNames[v]:moodIconNames[v])+'</div>').filter(Boolean).join("")+'</div><div class="entry-details">'+esc(e.symptoms.join("・"))+(e.temp?" · "+esc(e.temp)+"℃":"")+(e.weather?" · "+wxicon(e.weather.code)+" "+esc(e.weather.pressure)+"hPa"+(Number.isFinite(Number(e.weather.change))&&e.weather.change!==null?pressureTrend(Number(e.weather.change)):""):"")+'</div>'+(e.memo?'<p class="note entry-memo">'+esc(e.memo)+'</p>':"")+'</article>').join(""):'<div class="empty">この日の記録はまだないよ</div>')+'</section>';return s}
function otterSprite(mood="normal"){const w=32,h=32,p=Array.from({length:h},()=>Array(w).fill("."));const put=(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<h)p[y][x]=c};const ellipse=(cx,cy,rx,ry,c)=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(((x-cx)/rx)**2+((y-cy)/ry)**2<=1)put(x,y,c)};const outline=(cx,cy,rx,ry,c)=>{ellipse(cx,cy,rx+1,ry+1,"K");ellipse(cx,cy,rx,ry,c)};outline(16,22,10,8,"B");outline(9,10,3,3,"B");outline(23,10,3,3,"B");outline(16,14,11,9,"B");ellipse(16,18,9,6,"C");ellipse(12,14,1,1,"K");ellipse(20,14,1,1,"K");ellipse(16,18,1.4,1,"K");if(mood==="happy"){put(11,14,"K");put(12,13,"B");put(19,13,"B");put(20,14,"K");for(const [x,y] of [[14,20],[15,21],[16,21],[17,21],[18,20]])put(x,y,"K");outline(6,22,3,5,"B");outline(26,22,3,5,"B");}else if(mood==="rest"){for(const x of [11,12,19,20])put(x,14,"B");for(const [x,y] of [[10,15],[11,15],[12,15],[19,15],[20,15],[21,15]])put(x,y,"K");for(const x of [15,16,17])put(x,21,"K");}else{for(const x of [15,16,17])put(x,21,"K")}outline(9,27,4,2,"B");outline(23,27,4,2,"B");const colors={K:"#493a34",B:"#a98470",C:"#fff0dc"};let rect="";for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=p[y][x];if(colors[c])rect+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+colors[c]+'"/>'}return '<svg class="otter-pixel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="コツメカワウソ" shape-rendering="crispEdges">'+rect+'</svg>'}
let symptomRankingExpanded=false;
function monthlySymptomChart(y,m,n){const counts=new Map();for(let i=1;i<=n;i++){const day=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");const unique=new Set();dayEntries(day).forEach(e=>(Array.isArray(e.symptoms)?e.symptoms:[]).forEach(name=>{if(typeof name==="string"&&name.trim())unique.add(name.trim())}));unique.forEach(name=>counts.set(name,(counts.get(name)||0)+1))}const ranked=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"));if(!ranked.length)return '<div class="symptom-empty">'+icon("cloud")+'<span>今月は症状の記録がありません</span></div>';const max=ranked[0][1],visible=symptomRankingExpanded?ranked:ranked.slice(0,5);return '<div class="symptom-ranking">'+visible.map(([name,count])=>'<div class="symptom-rank"><div class="symptom-rank-head"><span class="symptom-rank-name">'+esc(name)+'</span><span class="symptom-rank-count"><strong>'+count+'</strong>日</span></div><div class="symptom-track" role="img" aria-label="'+esc(name)+'：'+count+'日"><div class="symptom-track-fill" style="width:'+(count/max*100)+'%"></div></div></div>').join("")+'</div>'+(ranked.length>5?'<button type="button" class="symptom-more" data-action="symptom-toggle" aria-expanded="'+symptomRankingExpanded+'">'+(symptomRankingExpanded?'閉じる':'すべて見る（全'+ranked.length+'件）')+' <i class="ph ph-caret-'+(symptomRankingExpanded?'up':'down')+'" aria-hidden="true"></i></button>':'')}
function summaryView(){let y=month.getFullYear(),m=month.getMonth(),n=new Date(y,m+1,0).getDate(),recorded=0,good=0,hard=0,sums=metrics.map(()=>[]),daily=[];for(let i=1;i<=n;i++){let day=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0"),es=dayEntries(day),v=dayAverage(day,0);if(es.length)recorded++;if(v!==null){if(v>=3)good++;if(v<=1)hard++}metrics.forEach((_,k)=>{let a=dayAverage(day,k);if(a!==null)sums[k].push(a)});daily.push(v)}let valid=sums[0].length,ratio=valid?good/valid:0,message=!valid?"まずは今日の気分から記録してみよう":ratio>=.7?"GOOD! 調子の良い日が多かったね！":ratio<.4?"ゆっくりいこう。つらい日も記録できたね。":"いいペース！ 自分のリズムを大切に。";let out='<section class="card"><div class="row"><h2 class="section-heading">月間集計</h2><div class="monthbuttons"><button data-action="prev">‹</button><b>'+y+'年'+(m+1)+'月</b><button data-action="next">›</button></div></div><div class="otter"><div class="animal">'+otterImage(!valid?"normal":ratio>=.7?"happy":ratio<.4?"tired":"normal")+'</div><div><b style="font-size:20px;color:#00b1c3">'+waveIcon()+(ratio>=.7?"GOOD!":ratio<.4&&valid?"ひとやすみ":"いいペース！")+'</b><p class="note">'+message+'</p></div></div><p class="muted">評価は記録のある日だけで集計。体調の良し悪しに優劣はないよ。</p></section><section class="card"><h2 class="section-heading">今月の記録</h2><p class="record-count">今月は <strong>'+recorded+'日</strong> / '+n+'日 記録しました</p><div class="statgrid focus-stats"><div class="stat good-stat"><small>気分が良かった日</small><div class="stat-otter">'+otterImage("happy")+'</div><div><b>'+good+'<span class="day-unit">日</span></b></div></div><div class="stat hard-stat"><small>気分がつらかった日</small><div class="stat-otter">'+otterImage("tired")+'</div><div><b>'+hard+'<span class="day-unit">日</span></b></div></div></div><p class="muted">良い日：1日の気分平均が4/5以上、つらい日：2/5以下</p></section><section class="card"><h2 class="section-heading">今月よく記録された症状</h2><p class="symptom-intro">記録した日数が多い順に表示しているよ。</p>'+monthlySymptomChart(y,m,n)+'<p class="symptom-footnote">同じ日に複数回選んでも、1日として集計します。</p></section><section class="card"><h2 class="section-heading">今月の気分の変化</h2><p class="chart-explain">1日ごとの「気分」の平均を5段階で表示しています。上ほど調子がよい状態です。</p><div class="mood-chart-wrap"><div class="mood-chart-axis" aria-hidden="true"><span class="tick tick-5"><b>5</b><small>とても良い</small></span><span class="tick tick-3"><b>3</b><small>ふつう</small></span><span class="tick tick-1"><b>1</b><small>とてもつらい</small></span></div><div class="chart">'+daily.map((v,i)=>'<div class="chartcol"><div class="chartbar" title="'+(i+1)+'日" style="height:'+(v===null?0:(v+1)*20)+'%"></div></div>').join("")+'</div></div><div class="row chart-dates"><small>1日</small><small>'+n+'日</small></div><p class="chart-note">縦軸：気分の評価（1〜5）／横軸：日付。記録がない日は空白です。</p></section>';return out}
function settingsView(){return '<section class="card"><h2 class="section-heading">天気を取得する地域</h2><p class="muted">GPSは使わず、指定した地域の気象データを表示するよ。</p><label>地域<select id="location" class="field"><option value="f" '+(config.name==="福知山市"?"selected":"")+'>福知山市</option><option value="k" '+(config.name==="京都市"?"selected":"")+'>京都市</option><option value="o" '+(config.name==="大阪市"?"selected":"")+'>大阪市</option><option value="t" '+(config.name==="東京都"?"selected":"")+'>東京都</option></select></label><p><button class="primary" data-action="location">地域を変更する</button></p></section><section class="card"><h2 class="section-heading">データのバックアップ</h2><p class="note">記録はこのブラウザの端末内に保存されるよ。ブラウザのデータ削除や端末故障に備えて、定期的にバックアップしてね。</p><button class="primary" data-action="export">JSONで書き出す</button><p><label class="pill" style="display:block;text-align:center">JSONから復元する <input type="file" id="import" accept=".json,application/json" style="display:none"></label></p><p class="muted">復元時は現在の記録と統合し、同じIDの記録は重複しないよ。</p></section><section class="card"><h2 class="section-heading">プライバシー</h2><p class="note">体調記録をGitHubや気象APIに送信することはないよ。気象APIには設定地域の座標を送信するよ。共有端末では使わないでね。</p><p class="muted">PUKARI Ver.0.1 · 診断や医療上の判断を行うアプリではありません。 © 2026 kino. 無断での再公開・再配布・販売は許可していません。利用条件：GitHub の USAGE_TERMS.md をご確認ください。</p></section>'}
function rememberFields(){let t=document.getElementById("temp"),o=document.getElementById("other"),m=document.getElementById("memo");if(t)draft.temp=t.value;if(o)draft.other=o.value;if(m)draft.memo=m.value}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;let n=b.dataset;if(n.nav){rememberFields();page=n.nav;render();return}if(n.score){rememberFields();let [i,j]=n.score.split(":").map(Number);draft.scores[i]=draft.scores[i]===j?null:j;render();return}if(n.symptom){rememberFields();draft.symptoms=draft.symptoms.includes(n.symptom)?draft.symptoms.filter(x=>x!==n.symptom):[...draft.symptoms,n.symptom];render();return}if(n.day){selectedDate=n.day;render();return}if(n.edit){let x=entries.find(e=>e.id===n.edit);if(x){editing=x.id;draft={scores:[...x.scores],symptoms:[...x.symptoms],temp:x.temp||"",other:x.other||"",memo:x.memo||""};page="record";render()}return}if(n.delete){if(confirm("この記録を削除しますか？")){entries=entries.filter(x=>x.id!==n.delete);save();render()}return}if(n.action==="symptom-toggle"){symptomRankingExpanded=!symptomRankingExpanded;render();return}if(n.action==="prev"||n.action==="next"){symptomRankingExpanded=false;month=new Date(month.getFullYear(),month.getMonth()+(n.action==="prev"?-1:1),1);selectedDate="";render();return}if(n.action==="refresh"){getWeather();return}if(n.action==="cancel"){editing=null;draft=blank();render();return}if(n.action==="save"){rememberFields();if(draft.scores.every(v=>v===null)&&!draft.symptoms.length&&!draft.memo.trim()){toast("気分か症状などをひとつ選んでね");return}if(draft.temp&&(Number(draft.temp)<30||Number(draft.temp)>43)){toast("体温の数値を確認してね");return}let old=entries.find(x=>x.id===editing),item={...draft,id:editing||crypto.randomUUID(),time:old?old.time:new Date().toISOString(),weather:old?old.weather:weather};if(editing)entries=entries.map(x=>x.id===editing?item:x);else entries.push(item);if(save()){editing=null;draft=blank();toast("記録したよ！ ✏️");render()}return}if(n.action==="location"){let x=document.getElementById("location").value;config=({f:{name:"福知山市",lat:35.2967,lon:135.1266},k:{name:"京都市",lat:35.0116,lon:135.7681},o:{name:"大阪市",lat:34.6937,lon:135.5023},t:{name:"東京都",lat:35.6762,lon:139.6503}})[x];localStorage.setItem(SETTINGS,JSON.stringify(config));toast("地域を変更したよ");getWeather();return}if(n.action==="export"){let blob=new Blob([JSON.stringify({version:1,entries},null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="kokorolog-backup-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}});
document.addEventListener("change",async e=>{if(e.target.id!=="import")return;let f=e.target.files[0];if(!f)return;if(f.size>5e6){toast("ファイルが大きすぎるよ");return}try{let x=JSON.parse(await f.text()),arr=x.entries;if(!Array.isArray(arr)||arr.some(v=>!v||typeof v.id!=="string"||!Array.isArray(v.scores)||v.scores.length!==4||typeof v.time!=="string"||isNaN(Date.parse(v.time))||!Array.isArray(v.symptoms))){throw Error("invalid")}if(!confirm(arr.length+"件の記録を統合して復元しますか？"))return;let map=new Map(entries.map(v=>[v.id,v]));arr.forEach(v=>map.set(v.id,v));entries=[...map.values()];if(save()){toast("復元したよ");render()}}catch{toast("正しいバックアップファイルではないようです")}});
load();selectedDate=today();render();getWeather();if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
